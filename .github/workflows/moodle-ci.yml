name: Moodle plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both ends of $plugin->supported, plus the LTS in between.
          - {php: '8.1', moodle-branch: 'MOODLE_402_STABLE'}
          - {php: '8.2', moodle-branch: 'MOODLE_405_STABLE'}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE'}

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, soap
          ini-values: max_input_vars=5000
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle
        id: install
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - run: moodle-plugin-ci phplint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: moodle-plugin-ci phpcs --max-warnings 0
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: moodle-plugin-ci phpdoc --max-warnings 0
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: moodle-plugin-ci validate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: moodle-plugin-ci savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: moodle-plugin-ci phpunit --fail-on-warning
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
